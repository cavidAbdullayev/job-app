server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/company
    username: javid
    password: 12345

  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  application:
    name: company-service

  rabbitmq:
    host: localhost
    port: 5672
    username: myuser
    password: mypassword

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

management:
  tracing:
    sampling:
      probability: 1.0

